<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujia CNC - Cantos</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
  <main>
    <p><a href="../index.html">← Volver al inicio</a></p>
    <section class="card">
      <h1>Cantos</h1>
      <p class="muted">Formulario futuro para mecanizado de cantos.</p>
      <form class="tool-form" aria-label="Formulario Cantos">
        <div class="form-field">
          <label for="length">Largo del canto (mm)</label>
          <input id="length" name="length" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="depth">Profundidad (mm)</label>
          <input id="depth" name="depth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="passes">Número de pasadas</label>
          <input id="passes" name="passes" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-actions">
          <button type="button" disabled>Generar próximamente</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
