<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujia CNC - Taladros</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
  <main>
    <p><a href="../index.html">← Volver al inicio</a></p>
    <section class="card">
      <h1>Taladros</h1>
      <p class="muted">Formulario futuro para operaciones de taladro.</p>
      <form class="tool-form" aria-label="Formulario Taladros">
        <div class="form-field">
          <label for="holeDepth">Profundidad de taladro (mm)</label>
          <input id="holeDepth" name="holeDepth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="safeZ">Z seguro (mm)</label>
          <input id="safeZ" name="safeZ" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="peckDepth">Peck opcional (mm)</label>
          <input id="peckDepth" name="peckDepth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-actions">
          <button type="button" disabled>Generar próximamente</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
