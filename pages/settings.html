<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujia CNC - Settings</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
  <main>
    <p><a href="../index.html">← Volver al inicio</a></p>
    <section class="card">
      <h1>Settings</h1>
      <p class="muted">Formulario futuro para preferencias opcionales de la caja de herramientas.</p>
      <form class="tool-form" aria-label="Formulario Settings">
        <div class="form-field">
          <label for="preferredExtension">Extensión preferida</label>
          <input id="preferredExtension" name="preferredExtension" type="text" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="notes">Notas locales</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Pendiente de implementación"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" disabled>Generar próximamente</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
