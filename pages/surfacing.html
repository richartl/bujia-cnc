<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujia CNC - Surfacing</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
  <main>
    <p><a href="../index.html">← Volver al inicio</a></p>
    <section class="card">
      <h1>Surfacing</h1>
      <p class="muted">Formulario futuro para aplanado de superficies. El generador funcional actual permanece en index.html hasta una migración aprobada.</p>
      <form class="tool-form" aria-label="Formulario Surfacing">
        <div class="form-field">
          <label for="widthX">Ancho X (mm)</label>
          <input id="widthX" name="widthX" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="lengthY">Largo Y (mm)</label>
          <input id="lengthY" name="lengthY" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="totalDepth">Profundidad total Z (mm)</label>
          <input id="totalDepth" name="totalDepth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="safeZ">Z seguro (mm)</label>
          <input id="safeZ" name="safeZ" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-actions">
          <button type="button" disabled>Generar próximamente</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
