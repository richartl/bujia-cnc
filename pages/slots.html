<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujia CNC - Ranuras</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
  <main>
    <p><a href="../index.html">← Volver al inicio</a></p>
    <section class="card">
      <h1>Ranuras</h1>
      <p class="muted">Formulario futuro para ranuras simples.</p>
      <form class="tool-form" aria-label="Formulario Ranuras">
        <div class="form-field">
          <label for="slotLength">Largo de ranura (mm)</label>
          <input id="slotLength" name="slotLength" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="slotWidth">Ancho de ranura (mm)</label>
          <input id="slotWidth" name="slotWidth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="slotDepth">Profundidad (mm)</label>
          <input id="slotDepth" name="slotDepth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-actions">
          <button type="button" disabled>Generar próximamente</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
