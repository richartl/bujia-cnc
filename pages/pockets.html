<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bujia CNC - Cavidades</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
  <main>
    <p><a href="../index.html">← Volver al inicio</a></p>
    <section class="card">
      <h1>Cavidades</h1>
      <p class="muted">Formulario futuro para cavidades simples.</p>
      <form class="tool-form" aria-label="Formulario Cavidades">
        <div class="form-field">
          <label for="pocketWidth">Ancho (mm)</label>
          <input id="pocketWidth" name="pocketWidth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="pocketLength">Largo (mm)</label>
          <input id="pocketLength" name="pocketLength" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-field">
          <label for="pocketDepth">Profundidad (mm)</label>
          <input id="pocketDepth" name="pocketDepth" type="number" placeholder="Pendiente de implementación">
        </div>
        <div class="form-actions">
          <button type="button" disabled>Generar próximamente</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
